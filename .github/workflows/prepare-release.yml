name: Prepare runtime release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: prepare-runtime-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --prefix packages/environment-connector
      - run: make verify
      - run: make verify-dsh
      - name: Build exact workload candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          mkdir candidate
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/guomonth/dsh-isolated-runtime:source-${GITHUB_SHA}"
          docker buildx build --platform linux/amd64 --provenance=false --push --build-arg SOURCE_REVISION="$GITHUB_SHA" --metadata-file candidate/image.json -f images/environment/Dockerfile -t "$image" .
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg version "$(cat VERSION)" --arg commit "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" --arg image "ghcr.io/guomonth/dsh-isolated-runtime@$(jq -r '."containerimage.digest"' candidate/image.json)" --slurpfile baseline compat/dsh/baseline.json '{repository:$repository,version:$version,commit:$commit,runId:$runId,workloadImage:$image,dsh:{version:$baseline[0].source.version,commit:$baseline[0].source.commit}}' > candidate/candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-candidate
          path: candidate/
          retention-days: 30
