name: Publish accepted MVP
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful main candidate run ID
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@v3
      - name: Verify the accepted candidate and record post-release live testing
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          ./hack/fetch-candidate.sh "$CANDIDATE_RUN" dist
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --name mvp-acceptance --dir evidence
          node hack/check-release.mjs dist evidence/deterministic.json deterministic
          source_sha="$(jq -r .sourceSHA dist/release.json)"
          gh issue view 54 --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/mvp-review.txt
          grep -Fq 'Decision: GO' /tmp/mvp-review.txt
          grep -Fq "$source_sha" /tmp/mvp-review.txt
          cp evidence/deterministic.json dist/deterministic.json
          jq '{sourceSHA, archiveSHA256, images, version,
            automaticAcceptance: {kind, success, model},
            liveModel: {status: "not-run", timing: "after-publication", owner: "maintainer"},
            decision: "Publish MVP pre-release; maintainer performs live end-to-end testing after publication",
            review: "https://github.com/GuoMonth/dsh-isolated-runtime/issues/54"}' \
            evidence/deterministic.json > dist/release-acceptance.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach version tags and publish original archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version dist/release.json)"
          source_sha="$(jq -r .sourceSHA dist/release.json)"
          test "$version" = v0.1.0
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Version already published; refusing to replace artifacts' >&2
            exit 1
          fi
          for type in cell operator; do
            ref="$(jq -r --arg type "$type" '.images[$type]' dist/release.json)"
            docker buildx imagetools create -t "${ref%@*}:$version" "$ref"
            actual="$(docker buildx imagetools inspect "${ref%@*}:$version" | awk '$1=="Digest:" {print $2;exit}')"
            test "$actual" = "${ref#*@}"
          done
          gh release create "$version" dist/* --repo "$GITHUB_REPOSITORY" --target "$source_sha" \
            --prerelease --title "$version — first local MVP" --notes-file docs/release-notes.md
      - name: Verify anonymous release download
        run: |
          version="$(jq -r .version dist/release.json)"
          archive="$(awk '{print $2}' dist/SHA256SUMS)"
          public_dir="$(mktemp -d)"
          trap 'rm -rf "$public_dir"' EXIT
          for file in "$archive" SHA256SUMS release.json deterministic.json release-acceptance.json; do
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$version/$file" \
              --output "$public_dir/$file"
          done
          cmp dist/SHA256SUMS "$public_dir/SHA256SUMS"
          cmp dist/release.json "$public_dir/release.json"
          cmp dist/release-acceptance.json "$public_dir/release-acceptance.json"
          node hack/check-release.mjs "$public_dir" "$public_dir/deterministic.json" deterministic
