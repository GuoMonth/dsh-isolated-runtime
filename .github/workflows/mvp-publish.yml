name: Publish accepted MVP
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful main candidate run ID
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@v3
      - name: Fetch both accepted archives and their matching evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          for target in linux-amd64 darwin-arm64; do
            ./hack/fetch-candidate.sh "$CANDIDATE_RUN" "candidates/$target" "$target"
            gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "mvp-acceptance-$target" --dir "candidates/$target/evidence"
          done
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name mvp-macos-host --dir candidates/darwin-arm64/evidence
          node hack/public-release.mjs prepare candidates dist
          node hack/public-release.mjs verify dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach version tags and publish original archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version dist/release.json)"
          source_sha="$(jq -r .sourceSHA dist/release.json)"
          test "$version" = "$(cat VERSION)"
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Version already published; refusing to replace artifacts' >&2
            exit 1
          fi
          for type in cell operator; do
            ref="$(jq -r --arg type "$type" '.images[$type]' dist/release.json)"
            docker buildx imagetools create -t "${ref%@*}:$version" "$ref"
            actual="$(docker buildx imagetools inspect "${ref%@*}:$version" | awk '$1=="Digest:" {print $2;exit}')"
            test "$actual" = "${ref#*@}"
          done
          gh release create "$version" dist/* --repo "$GITHUB_REPOSITORY" --target "$source_sha" \
            --prerelease --title "$version - DSH $(jq -r .source.version compat/dsh/baseline.json)" --notes-file docs/release-notes.md
      - name: Verify anonymous release download
        run: |
          version="$(jq -r .version dist/release.json)"
          public_dir="$(mktemp -d)"
          trap 'rm -rf "$public_dir"' EXIT
          for original in dist/*; do
            file="${original##*/}"
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$version/$file" \
              --output "$public_dir/$file"
            cmp "$original" "$public_dir/$file"
          done
          node hack/public-release.mjs verify "$public_dir"
