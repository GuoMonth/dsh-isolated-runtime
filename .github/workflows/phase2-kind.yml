name: Phase 2 trusted browser access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Envoy Gateway / Dex / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Install Kubernetes test tools
        run: bash hack/install-kubernetes-test-tools.sh
      - name: Run the trusted browser access proof
        run: make verify-kind-phase2
