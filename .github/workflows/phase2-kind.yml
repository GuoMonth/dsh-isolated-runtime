name: Phase 2 trusted browser access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "images/**"
      - "internal/**"
      - "test/e2e/phase2/**"
      - "hack/verify-phase2-kind.sh"
      - ".github/workflows/phase2-kind.yml"
  pull_request:
    paths:
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "images/**"
      - "internal/**"
      - "test/e2e/phase2/**"
      - "hack/verify-phase2-kind.sh"
      - ".github/workflows/phase2-kind.yml"

permissions:
  contents: read

concurrency:
  group: phase2-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Envoy Gateway / Dex / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0
      - name: Run the trusted browser access proof
        run: make verify-kind-phase2
