name: Retire legacy npm package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-alpha-publication
  cancel-in-progress: false
jobs:
  deprecate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Deprecate both legacy versions without deleting artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NOTICE: 'This standalone runtime installer is retired. Install dsh-multi-tenant instead: https://github.com/GuoMonth/dsh-multi-tenant#readme . Current runtime images and source releases remain at https://github.com/GuoMonth/dsh-isolated-runtime/releases .'
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm whoami
          for version in 0.2.0-alpha.1 0.3.0-alpha.1; do
            npm deprecate "dsh-isolated-runtime@$version" "$NOTICE"
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          for (let attempt = 0; attempt < 60; attempt++) {
            const response = await fetch(`https://registry.npmjs.org/dsh-isolated-runtime?retirement=${Date.now()}`, {signal: AbortSignal.timeout(20000)});
            assert.equal(response.ok, true, `Registry HTTP ${response.status}`);
            const metadata = await response.json();
            const versions = Object.values(metadata.versions);
            assert.equal(versions.length, 2, 'Unexpected version set; inspect before changing additional versions');
            if (versions.every(version => version.deprecated === process.env.NOTICE)) {
              console.log('Verified deprecation on all legacy versions; tarballs and dist-tags retained.');
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Deprecation not visible yet; inspect registry before retrying');
          JS
