name: Phase 4 fleet operations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fleet quota / backpressure / multi-namespace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Install Kubernetes test tools
        run: bash hack/install-kubernetes-test-tools.sh
      - name: Run the bounded fleet proof
        run: make verify-kind-phase4
