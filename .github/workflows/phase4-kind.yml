name: Phase 4 fleet operations

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase4-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fleet quota / backpressure / multi-namespace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0
      - name: Run the bounded fleet proof
        run: make verify-kind-phase4
