name: Publish npm latest
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: npm-alpha-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify fixed public Cell release and pack
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version packages/cell-cli/package.json)"
          test "v$version" = "$(jq -r .version packages/cell-cli/release.json)"
          gh release view "v$version" --json isDraft | jq -e '.isDraft == false'
          gh release download "v$version" --pattern release.json --dir public
          cmp public/release.json packages/cell-cli/release.json
          node packages/cell-cli/bin/cli.mjs --verify-release
          npm test --prefix packages/cell-cli
          mkdir -p npm-dist
          npm pack ./packages/cell-cli --ignore-scripts --pack-destination npm-dist
          archive="$GITHUB_WORKSPACE/npm-dist/dsh-isolated-runtime-$version.tgz"
          mkdir consumer
          npm install --prefix consumer --ignore-scripts --no-audit --no-fund "$archive"
          node consumer/node_modules/dsh-isolated-runtime/bin/cli.mjs --verify-release
          npm publish "$archive" --dry-run --ignore-scripts --access public --tag latest
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: cell-npm-package
          path: npm-dist/*.tgz
          retention-days: 30
      - name: Publish original tarball and verify registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm whoami --registry https://registry.npmjs.org
          expected="sha512-$(openssl dgst -sha512 -binary "$ARCHIVE" | openssl base64 -A)"
          if npm view "dsh-isolated-runtime@$VERSION" dist.integrity --json > existing.json 2> registry-error.txt; then
            test "$(jq -r . existing.json)" = "$expected"
            echo 'Exact version already exists; skipping upload.'
          else
            # Only a definite registry 404 permits publication; auth/network failures stop.
            grep -q 'E404' registry-error.txt
            npm publish "$ARCHIVE" --ignore-scripts --access public --tag latest --registry https://registry.npmjs.org
          fi
          for _attempt in {1..40}; do
            actual="$(timeout 20s npm view "dsh-isolated-runtime@$VERSION" dist.integrity --registry https://registry.npmjs.org 2>/dev/null || true)"
            tag="$(timeout 20s npm view dsh-isolated-runtime dist-tags.latest --registry https://registry.npmjs.org 2>/dev/null || true)"
            if [[ "$actual" == "$expected" && "$tag" == "$VERSION" ]]; then
              echo "Published dsh-isolated-runtime@$VERSION to latest" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo '::error::Registry did not converge; inspect before retrying. Do not republish changed bytes.'
          exit 1
      - name: Attach npm artifact and package source to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          jq -n --arg version "$VERSION" --arg source "$GITHUB_SHA" \
            --arg integrity "sha512-$(openssl dgst -sha512 -binary "$ARCHIVE" | openssl base64 -A)" \
            '{package:"dsh-isolated-runtime",version:$version,packageSourceSHA:$source,integrity:$integrity,channel:"latest",runtimeManifest:"release.json"}' > npm-publication.json
          for file in "$ARCHIVE" npm-publication.json; do
            name="$(basename "$file")"
            if gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              mkdir -p existing-assets
              gh release download "v$VERSION" --pattern "$name" --dir existing-assets
              cmp "$file" "existing-assets/$name"
            else
              gh release upload "v$VERSION" "$file"
            fi
          done
