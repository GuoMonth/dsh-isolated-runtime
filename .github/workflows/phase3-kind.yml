name: Phase 3 writer-stopped data lifecycle

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase3-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CSI snapshot / restore / rollout / rollback
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0
      - name: Run the writer-stopped lifecycle proof
        run: make verify-kind-phase3
