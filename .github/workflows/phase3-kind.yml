name: Phase 3 writer-stopped data lifecycle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CSI snapshot / restore / rollout / rollback
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Install Kubernetes test tools
        run: bash hack/install-kubernetes-test-tools.sh
      - name: Run the writer-stopped lifecycle proof
        run: make verify-kind-phase3
