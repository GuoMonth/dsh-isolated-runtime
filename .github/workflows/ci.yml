name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standards:
    name: ${{ matrix.node == '24.22.3' && 'Source standards' || format('Node {0}', matrix.node) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.3', '26.13.1']
    env:
      LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - run: pnpm install --frozen-lockfile
      - run: make verify
      - name: Verify the official DSH distribution when its integration changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git diff --quiet "$LINT_BASE_REF...HEAD" -- .node-version go.mod go.sum compat/dsh images/environment internal/dshcompat cmd/environment-launcher test/e2e/dshprobe hack/verify-dsh-compat.sh; then
            make verify-dsh
          fi
      - name: Workflow syntax
        if: matrix.node == '24.22.3'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -shellcheck=""
