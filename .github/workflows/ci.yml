name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standards:
    name: Source standards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Syntax, Go formatting, whitespace and LF endings
        run: node hack/check-standards.mjs
      - name: Workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -shellcheck=""
