name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Verify
        run: make verify

  cell-contract:
    name: Cell contract (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0
      - name: Verify Cell API against Kubernetes
        run: make verify-cell

  controller-envtest:
    name: controller envtest (Kubernetes 1.34)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Verify reconciliation against a real API server
        run: make test-envtest

  manifests:
    name: Kustomize manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render install surface
        run: |
          kubectl kustomize config/default > /tmp/dsh-install.yaml
          kubectl kustomize config/phase2 > /tmp/dsh-phase2-install.yaml
          kubectl kustomize config/phase3 > /tmp/dsh-phase3-install.yaml
      - name: Assert one controller and both public CRDs
        run: |
          test "$(grep -c '^kind: CustomResourceDefinition$' /tmp/dsh-install.yaml)" = 2
          test "$(grep -c '^kind: Deployment$' /tmp/dsh-install.yaml)" = 1
          test "$(grep -c '^kind: CustomResourceDefinition$' /tmp/dsh-phase2-install.yaml)" = 2
          test "$(grep -c '^kind: Deployment$' /tmp/dsh-phase2-install.yaml)" = 2
          test "$(grep -c '^kind: CustomResourceDefinition$' /tmp/dsh-phase3-install.yaml)" = 2
          test "$(grep -c '^kind: Deployment$' /tmp/dsh-phase3-install.yaml)" = 2
          grep -q '^kind: Gateway$' /tmp/dsh-phase2-install.yaml
          grep -q '^kind: Backend$' /tmp/dsh-phase2-install.yaml
          grep -q '^kind: SecurityPolicy$' /tmp/dsh-phase2-install.yaml
          grep -q -- '--enable-snapshots=true' /tmp/dsh-phase3-install.yaml
          grep -q -- '--writer-stop-timeout=2m' /tmp/dsh-phase3-install.yaml
          grep -q -- '--snapshot-timeout=30m' /tmp/dsh-phase3-install.yaml

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          args: --timeout=3m
