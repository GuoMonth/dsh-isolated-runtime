name: Phase 1 kind vertical slice

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "images/**"
      - "internal/**"
      - "test/e2e/**"
      - "hack/verify-phase1-kind.sh"
      - ".github/workflows/phase1-kind.yml"
  pull_request:
    paths:
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "images/**"
      - "internal/**"
      - "test/e2e/**"
      - "hack/verify-phase1-kind.sh"
      - ".github/workflows/phase1-kind.yml"

permissions:
  contents: read

concurrency:
  group: phase1-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Kubernetes 1.34 / Calico / local-path
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0
      - name: Run the complete Single-Cell proof
        run: make verify-kind
