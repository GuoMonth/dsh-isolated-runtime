name: OCI images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: real DSH image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify production images
        run: make verify-images
