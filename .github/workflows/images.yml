name: OCI images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "images/**"
      - "go.mod"
      - "go.sum"
      - "hack/verify-images.sh"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "images/**"
      - "go.mod"
      - "go.sum"
      - "hack/verify-images.sh"
      - ".github/workflows/images.yml"

permissions:
  contents: read

jobs:
  verify:
    name: real DSH image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify production images
        run: make verify-images

  publish:
    name: publish ${{ matrix.name }} (linux/amd64)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: cell
            dockerfile: images/cell/Dockerfile
            image: ghcr.io/guomonth/dsh-isolated-runtime-cell
          - name: operator
            dockerfile: images/operator/Dockerfile
            image: ghcr.io/guomonth/dsh-isolated-runtime-operator
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record immutable digest
        run: echo '${{ matrix.image }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
