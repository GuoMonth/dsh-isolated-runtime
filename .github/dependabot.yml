version: 2
# Routine upgrades are reviewed manually with the project's compatibility baseline.
# A zero limit disables version PRs without disabling security-update support.
updates:
  - package-ecosystem: gomod
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
