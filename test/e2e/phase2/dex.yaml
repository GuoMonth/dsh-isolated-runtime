apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
  namespace: dsh-system
data:
  config.yaml: |
    issuer: https://dex.dsh-system.svc:15556/dex
    storage:
      type: memory
    web:
      https: 0.0.0.0:5554
      tlsCert: /etc/dex/tls/tls.crt
      tlsKey: /etc/dex/tls/tls.key
    oauth2:
      skipApprovalScreen: true
    enablePasswordDB: true
    staticClients:
      - id: dsh-browser
        name: DSH Browser
        secret: dsh-phase2-client-secret
        redirectURIs:
          - https://auth.cells.test:18443/oauth2/callback
    staticPasswords:
      - email: alice@example.com
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: alice
        name: Alice
        userID: alice-sub
        groups: [developers]
      - email: bob@example.com
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: bob
        name: Bob
        userID: bob-sub
        groups: [team-b]
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: dsh-system
spec:
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: https
      port: 15556
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: dsh-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
          command: [/usr/local/bin/dex]
          args: [serve, /etc/dex/config/config.yaml]
          ports:
            - name: https
              containerPort: 5554
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /dex/.well-known/openid-configuration
              port: https
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/dex/config
              readOnly: true
            - name: tls
              mountPath: /etc/dex/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dex
        - name: tls
          secret:
            secretName: dex-tls
