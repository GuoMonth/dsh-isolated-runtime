apiVersion: apps/v1
kind: Deployment
metadata:
  name: cell-operator
  labels:
    app.kubernetes.io/name: cell-operator
    app.kubernetes.io/managed-by: dsh-isolated-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cell-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cell-operator
        app.kubernetes.io/managed-by: dsh-isolated-runtime
    spec:
      serviceAccountName: cell-operator
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
      terminationGracePeriodSeconds: 10
