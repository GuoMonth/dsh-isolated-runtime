# Runtime is namespaced and tenant-owned. Namespace placement is an
# infrastructure boundary; spec.tenant is the explicit immutable application
# owner used by the runtime contract and control plane.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: runtimes.runtime.dsh.io
spec:
  group: runtime.dsh.io
  scope: Namespaced
  names:
    kind: Runtime
    listKind: RuntimeList
    plural: runtimes
    singular: runtime
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tenant]
              x-kubernetes-validations:
                - rule: "self.tenant == oldSelf.tenant"
                  message: "spec.tenant is immutable"
              properties:
                tenant:
                  type: string
                  minLength: 1
                runtimeClass:
                  type: string
                securityClass:
                  type: string
                  enum: [standard, sandboxed]
                networkIsolation:
                  type: boolean
                resourceLimits:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                runtimeRef:
                  type: string
                message:
                  type: string
