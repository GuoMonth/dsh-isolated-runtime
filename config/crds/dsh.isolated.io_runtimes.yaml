apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: runtimes.runtime.dsh.io
spec:
  group: runtime.dsh.io
  scope: Namespaced
  names:
    kind: Runtime
    listKind: RuntimeList
    plural: runtimes
    singular: runtime
    shortNames: [dshrt]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenant
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Security
          type: string
          jsonPath: .spec.securityClass
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tenant, image]
              x-kubernetes-validations:
                - rule: "self.tenant == oldSelf.tenant"
                  message: "spec.tenant is immutable"
              properties:
                tenant:
                  type: string
                  minLength: 1
                image:
                  type: string
                  minLength: 1
                runtimeClass:
                  type: string
                securityClass:
                  type: string
                  enum: [standard, sandboxed]
                  default: standard
                networkIsolation:
                  type: boolean
                  default: true
                resourceLimits:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Failed, Terminating]
                runtimeRef:
                  type: string
                message:
                  type: string
