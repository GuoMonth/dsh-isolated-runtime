apiVersion: v1
kind: ServiceAccount
metadata:
  name: cell-authorizer
  labels:
    app.kubernetes.io/name: cell-authorizer
    app.kubernetes.io/managed-by: dsh-isolated-runtime
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cell-authorizer
rules:
  - apiGroups: ["dsh.isolated.io"]
    resources: ["cells"]
    verbs: ["get"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cell-authorizer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cell-authorizer
subjects:
  - kind: ServiceAccount
    name: cell-authorizer
    namespace: dsh-system
---
apiVersion: v1
kind: Service
metadata:
  name: cell-authorizer
  labels:
    app.kubernetes.io/name: cell-authorizer
    app.kubernetes.io/managed-by: dsh-isolated-runtime
spec:
  selector:
    app.kubernetes.io/name: cell-authorizer
  ports:
    - name: grpc
      port: 9001
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
    - name: callback
      port: 8080
      targetPort: callback
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: cell-authorizer
spec:
  endpoints:
    - fqdn:
        hostname: cell-authorizer.dsh-system.svc
        port: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cell-authorizer
  labels:
    app.kubernetes.io/name: cell-authorizer
    app.kubernetes.io/managed-by: dsh-isolated-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cell-authorizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cell-authorizer
        app.kubernetes.io/managed-by: dsh-isolated-runtime
    spec:
      serviceAccountName: cell-authorizer
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authorizer
          image: controller:latest
          imagePullPolicy: IfNotPresent
          command: [/cell-authorizer]
          args:
            - --oidc-issuer=https://idp.example.com
            - --oidc-client-id=dsh-browser
            - --gateway-name=dsh
            - --gateway-namespace=dsh-system
            - --gateway-section-name=https
            - --base-domain=cells.example.com
            - --external-https-port=443
          ports:
            - name: callback
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: grpc
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
      terminationGracePeriodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cell-authorizer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cell-authorizer
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dsh-system
          podSelector:
            matchLabels:
              dsh.isolated.io/access: "true"
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9001
