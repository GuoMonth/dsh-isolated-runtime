# Minimal RBAC for the control plane. The controller needs read/write on the
# isolated-runtime resources; the exact verbs are tightened at M1.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dsh-isolated-runtime
rules:
  - apiGroups: ["runtime.dsh.io"]
    resources:
      - runtimes
      - runtimeimages
      - runtimeprofiles
      - runtimesessions
      - checkpoints
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
