apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dsh-system
resources:
  - ../default
  - authorizer.yaml
  - gateway.yaml
  - security-policy.yaml
patches:
  - path: manager-patch.yaml
  - path: namespace-patch.yaml
images:
  - name: controller
    newName: ghcr.io/guomonth/dsh-isolated-runtime-operator
    newTag: main
