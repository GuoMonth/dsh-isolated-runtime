apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-isolated-control-plane
  namespace: dsh-isolated-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsh-isolated-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsh-isolated-control-plane
    spec:
      serviceAccountName: dsh-isolated-control-plane
      containers:
        - name: control-plane
          image: ghcr.io/guomonth/dsh-isolated-runtime:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DSH_LISTEN_ADDR
              value: ":8080"
            - name: DSH_RUNTIME_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
