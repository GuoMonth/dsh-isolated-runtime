apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: dsh-isolated-runtime
    app.kubernetes.io/name: cell-operator
  name: cell-operator
  namespace: dsh-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cell-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: dsh-isolated-runtime
        app.kubernetes.io/name: cell-operator
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - --access-mode=platform
        - --base-domain=cells.example.com
        - --external-https-port=443
        - --cell-concurrency=1
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: ghcr.io/guomonth/dsh-isolated-runtime-operator@sha256:48a7068c5e0765db5e4aeafc7aa2eb15553ce73df7c4b71e1e15021966b88deb
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cell-operator
      terminationGracePeriodSeconds: 10
