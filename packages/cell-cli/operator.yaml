                    - name
                    type: object
                  retentionPolicy:
                    default: Retain
                    description: |-
                      RetentionPolicy defaults to Retain so deleting a Cell cannot silently
                      destroy tenant data. It is immutable after creation so deletion ownership
                      is decided once without a finalizer or deletion-time race.
                    enum:
                    - Retain
                    - Delete
                    type: string
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Size is the requested data-volume capacity and may
                      only grow.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: StorageClassName selects a CSI storage class. Once
                      set, it is immutable.
                    type: string
