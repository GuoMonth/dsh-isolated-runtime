              storage:
                description: Storage is durable DSH and workspace data.
                properties:
                  restoreFrom:
                    description: |-
                      RestoreFrom creates the initial data PVC from a Ready CellSnapshot in
                      this namespace. It is creation-only because PVC dataSource is immutable.
